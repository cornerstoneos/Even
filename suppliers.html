<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Even for supply houses</title>
<meta name="description" content="Send your contractor price sheet to Even. Free for you.">
<link rel="icon" type="image/png" href="/assets/favicon-64.png">
<meta name="theme-color" content="#F6F3EC">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#F6F3EC;--card:#FFFFFF;--ink:#17150F;--ink2:#4A463D;--muted:#857F72;--rim:rgba(0,0,0,0.09);--gold:#C8920A;--goldbg:#FFB300;--red:#C0392B;--green:#1E8E4E}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.lang{display:flex;border:1px solid var(--rim);border-radius:999px;overflow:hidden;background:var(--card);flex-shrink:0}
.lang button{border:0;background:none;padding:6px 12px;font:500 12px 'DM Mono',monospace;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;border-radius:10px;background:var(--ink);color:var(--goldbg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.co{font-weight:700;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.co-sub{font-size:13px;color:var(--muted)}
.co-sub a{color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--rim);border-radius:14px;padding:18px 16px}
h1{font-size:22px;line-height:1.2;margin-bottom:6px}
.lead{color:var(--ink2);font-size:14px;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
label .opt{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--rim);border-radius:10px;padding:11px 12px;font:16px 'DM Sans',system-ui,sans-serif;color:var(--ink);background:#FBFAF7}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--goldbg);outline-offset:0;border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
@media(max-width:380px){.row{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.err{color:var(--red);font-size:13px;margin-top:12px;display:none}
button.send{width:100%;margin-top:18px;border:0;border-radius:10px;padding:14px;background:var(--ink);color:#fff;font:700 15px 'DM Sans',system-ui,sans-serif;cursor:pointer}
button.send:disabled{opacity:.55;cursor:default}
.note{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
.done{text-align:center;padding:26px 8px}
.done .tick{width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.foot{text-align:center;font:500 11px 'DM Mono',monospace;color:var(--muted);margin-top:22px;letter-spacing:.4px}
.foot a{color:var(--muted)}
.missing{text-align:center;padding:40px 10px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;font-size:13px;color:var(--ink);background:#FBFAF7;border:1px solid var(--rim);border-radius:999px;padding:7px 11px;cursor:pointer}
.chips input{width:auto;margin:0}
.file{border:1.5px dashed rgba(0,0,0,.2);border-radius:10px;padding:14px;text-align:center;font-size:13px;color:var(--ink2);background:#FBFAF7;cursor:pointer;display:block}
.file input{display:none}
.file b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px;overflow-wrap:anywhere}
.promise{font-size:13px;color:var(--ink2);background:#FFF8E6;border:1px solid #F2DFA8;border-radius:10px;padding:10px 12px;margin:0 0 14px;line-height:1.5}
.brandmark{font-weight:800;font-size:22px;letter-spacing:-.5px}.brandmark span{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brandmark">even<span>.</span></div>
    <div class="lang"><button id="l-en" class="on" onclick="setLang('en')">EN</button><button id="l-es" onclick="setLang('es')">ES</button></div>
  </div>
  <div class="card">
    <form id="sf" novalidate onsubmit="send(event)">
      <h1 data-t="title"></h1>
      <div class="lead" data-t="lead"></div>
      <div class="promise" data-t="promise"></div>

      <label for="f-company" data-t="company"></label>
      <input id="f-company" maxlength="120" autocomplete="organization" required>
      <label for="f-contact"><span data-t="contact"></span> <span class="opt" data-t="optional"></span></label>
      <input id="f-contact" maxlength="100" autocomplete="name">
      <div class="row">
        <div><label for="f-phone" data-t="phone"></label><input id="f-phone" maxlength="40" inputmode="tel" autocomplete="tel"></div>
        <div><label for="f-email" data-t="email"></label><input id="f-email" maxlength="200" type="email" autocomplete="email"></div>
      </div>
      <div class="hint" data-t="contactHint"></div>

      <label data-t="counties"></label>
      <div class="chips" id="counties"></div>
      <label data-t="trades"></label>
      <div class="chips" id="trades"></div>

      <label data-t="sheet"></label>
      <label class="file" for="f-file"><input id="f-file" type="file" accept=".pdf,.csv,.xls,.xlsx,.jpg,.jpeg,.png" onchange="pickFile(this)"><b id="file-name" data-t="pick"></b><span data-t="fileHint"></span></label>

      <label for="f-note"><span data-t="note"></span> <span class="opt" data-t="optional"></span></label>
      <textarea id="f-note" maxlength="1000" style="min-height:80px"></textarea>

      <div class="hp" aria-hidden="true"><label for="f-website">Website</label><input id="f-website" tabindex="-1" autocomplete="off"></div>
      <div class="err" id="err"></div>
      <button class="send" id="send-btn" type="submit" data-t="send"></button>
      <div class="note" data-t="free"></div>
    </form>
    <div class="done" id="done" hidden>
      <div class="tick">&#10003;</div>
      <h1 data-t="doneTitle"></h1>
      <div class="lead" data-t="doneText" style="margin:8px 0 0"></div>
    </div>
  </div>
  <div class="foot"><a href="https://even-os.com">even-os.com</a></div>
</div>
<script>
// Supply houses send their contractor price sheet. No account. The file goes to
// a private bucket on the server; nothing on this page is public afterwards.
const API_ORIGIN='https://even-production.up.railway.app';
const MAX=10*1024*1024, OK_EXT=/\.(pdf|csv|xls|xlsx|jpe?g|png)$/i;
const COUNTIES=[['Miami-Dade','Miami-Dade'],['Broward','Broward'],['Palm Beach','Palm Beach'],['Other','Otro']];
const TRADES=[['Roofing','Techado'],['Electrical','Eléctrico'],['Plumbing','Plomería'],['HVAC','Aire acondicionado'],['Lumber and framing','Madera y estructura'],['Drywall','Drywall'],['Flooring and tile','Pisos y losas'],['Concrete','Concreto'],['Windows and doors','Ventanas y puertas'],['Pools','Piscinas'],['Landscaping and irrigation','Paisajismo y riego'],['Other','Otro']];
const TEXT={
  en:{title:'Send us your contractor price sheet',lead:'Even is the estimating tool contractors use to price real jobs. Share your contractor price sheet and your products can show up, with your name, on the estimates of contractors who pick you as their supply house.',
    promise:"We never publish or resell your price sheet. Your prices are used inside contractors' estimates, shown line by line on the job they're pricing.",
    company:'Company',contact:'Contact name',optional:'(optional)',phone:'Phone',email:'Email',contactHint:'A phone or an email, so we can reach you.',
    counties:'Counties you serve',trades:'What you sell',sheet:'Price sheet',pick:'Choose a file',fileHint:'PDF, Excel, CSV or a photo. Up to 10 MB.',note:'Note',
    send:'Send price sheet',sending:'Sending…',free:'Free for you.',doneTitle:"Got it, we'll be in touch",doneText:'Thanks. We will review your price sheet and reach out.',
    errors:{company:'Add your company name.',contact:'Add a phone or an email.',email:'Check the email address.',file:'Choose your price sheet file.',file_type:'Use a PDF, Excel, CSV or photo file.',file_size:'That file is over 10 MB.',rate_limited:'Too many tries from this connection. Try again later.',other:'Something went wrong. Try again in a minute.'}},
  es:{title:'Envíanos tu lista de precios para contratistas',lead:'Even es la herramienta de estimados que usan los contratistas para cotizar trabajos reales. Comparte tu lista de precios para contratistas y tus productos pueden aparecer, con tu nombre, en los estimados de los contratistas que te eligen como su casa de materiales.',
    promise:'Nunca publicamos ni revendemos tu lista de precios. Tus precios se usan dentro de los estimados de los contratistas, línea por línea, en el trabajo que están cotizando.',
    company:'Empresa',contact:'Nombre de contacto',optional:'(opcional)',phone:'Teléfono',email:'Correo',contactHint:'Un teléfono o un correo para poder contactarte.',
    counties:'Condados donde vendes',trades:'Qué vendes',sheet:'Lista de precios',pick:'Elige un archivo',fileHint:'PDF, Excel, CSV o una foto. Hasta 10 MB.',note:'Nota',
    send:'Enviar lista de precios',sending:'Enviando…',free:'Gratis para ti.',doneTitle:'Recibido, te contactaremos',doneText:'Gracias. Vamos a revisar tu lista de precios y te contactamos.',
    errors:{company:'Agrega el nombre de tu empresa.',contact:'Agrega un teléfono o un correo.',email:'Revisa el correo.',file:'Elige el archivo de tu lista de precios.',file_type:'Usa un archivo PDF, Excel, CSV o una foto.',file_size:'Ese archivo pasa de 10 MB.',rate_limited:'Demasiados intentos desde esta conexión. Intenta más tarde.',other:'Algo salió mal. Intenta de nuevo en un minuto.'}}
};
let lang=/suppliers-es/.test(location.pathname)||new URLSearchParams(location.search).get('lang')==='es'||/^es\b/i.test(navigator.language||'')?'es':'en', file=null;
const $=id=>document.getElementById(id);
function chips(id,list,name){ const prev=new Set([...document.querySelectorAll(`#${id} input:checked`)].map(i=>i.value));
  $(id).innerHTML=list.map(([v,es])=>`<label><input type="checkbox" name="${name}" value="${v}"${prev.has(v)?' checked':''}> ${lang==='es'?es:v}</label>`).join(''); }
function setLang(l){
  lang=l; document.documentElement.lang=l;
  $('l-en').classList.toggle('on',l==='en'); $('l-es').classList.toggle('on',l==='es');
  document.querySelectorAll('[data-t]').forEach(el=>{ if(el.id==='file-name'&&file) return; const v=TEXT[l][el.dataset.t]; if(typeof v==='string') el.textContent=v; });
  document.title=TEXT[l].title; chips('counties',COUNTIES,'county'); chips('trades',TRADES,'trade');
}
function showErr(codes){ const E=TEXT[lang].errors; $('err').textContent=(Array.isArray(codes)?codes:[codes]).map(c=>E[c]||E.other).join(' '); $('err').style.display='block'; }
function pickFile(inp){
  $('err').style.display='none'; const f=inp.files&&inp.files[0]; file=null;
  if(!f){ $('file-name').textContent=TEXT[lang].pick; return; }
  if(!OK_EXT.test(f.name)){ inp.value=''; $('file-name').textContent=TEXT[lang].pick; return showErr('file_type'); }
  if(f.size>MAX){ inp.value=''; $('file-name').textContent=TEXT[lang].pick; return showErr('file_size'); }
  file=f; $('file-name').textContent=f.name;
}
const toB64=f=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=rej; r.readAsDataURL(f); });
async function send(ev){
  ev.preventDefault(); $('err').style.display='none';
  const v=id=>$(id).value.trim();
  const body={company:v('f-company'),contact_name:v('f-contact'),phone:v('f-phone'),email:v('f-email'),note:v('f-note'),website:v('f-website'),lang,
    counties:[...document.querySelectorAll('#counties input:checked')].map(i=>i.value),trades:[...document.querySelectorAll('#trades input:checked')].map(i=>i.value)};
  const bad=[];
  if(!body.company) bad.push('company');
  if(!body.phone&&!body.email) bad.push('contact');
  if(body.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(body.email)) bad.push('email');
  if(!file) bad.push('file');
  if(bad.length) return showErr(bad);
  const btn=$('send-btn'); btn.disabled=true; btn.textContent=TEXT[lang].sending;
  try{
    body.file={name:file.name,type:file.type,data:await toB64(file)};
    const r=await fetch(`${API_ORIGIN}/api/supplier-signup`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw Object.assign(new Error('x'),{codes:d.error?.fields||d.error?.code||'other'});
    $('sf').hidden=true; $('done').hidden=false; window.scrollTo({top:0});
  }catch(e){ showErr(e.codes||'other'); }
  finally{ btn.disabled=false; btn.textContent=TEXT[lang].send; }
}
setLang(lang);
</script>
</body>
</html>
