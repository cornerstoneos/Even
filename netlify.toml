[functions]
  directory = "netlify/functions"

# Quote-request link: even-os.com/q/<slug> serves the homeowner form.
[[redirects]]
  from = "/q/*"
  to = "/q.html"
  status = 200

# Supplier signup: even-os.com/suppliers (permanent: the leave-behind QR points here).
[[redirects]]
  from = "/suppliers"
  to = "/suppliers.html"
  status = 200

[[redirects]]
  from = "/suppliers-es"
  to = "/suppliers.html"
  status = 200
