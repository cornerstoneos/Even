<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Even — Marketing Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Hidden static mirror of the "job-upload" form in src/routes/Manual.jsx.
      Netlify's form detection scans the built HTML at deploy time — it
      can't see a form that only ever exists inside a client-rendered React
      tree, so this duplicate (never shown, never submitted) is what makes
      Netlify register the form and its fields. Keep the name and field
      names here in sync with the real form.
    -->
    <form name="job-upload" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="file" name="job-file" />
      <textarea name="notes"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
